id = "sean.tab-jumper"
name = "Tab Jumper"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Fuzzy-jump to any tab in any workspace with fzf"
platforms = ["macos", "linux"]

[[actions]]
id = "jump"
title = "Jump to tab"
contexts = ["workspace"]
command = ["sh", "open-picker.sh"]

[[panes]]
id = "picker"
title = "Jump to tab"
placement = "popup"
width = "50%"
height = 16
command = ["sh", "picker.sh"]
